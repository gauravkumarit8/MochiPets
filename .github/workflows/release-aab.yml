name: Release AAB (Play Store)

# Run manually: GitHub > Actions > "Release AAB (Play Store)" > Run workflow.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD     (required: upload key)
#   ADMOB_APP_ID, ADMOB_REWARDED_ID                                 (optional: real AdMob ids)
#   ADMOB_TEST_DEVICES                                              (optional: comma separated)
# Without the AdMob secrets the bundle uses Google's TEST ads, which is what you want for closed testing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ADMOB_TEST_DEVICES: ${{ secrets.ADMOB_TEST_DEVICES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Report which ad ids will be used
        run: |
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_REWARDED_ID" ]; then
            echo "::warning::No AdMob secrets set. This bundle uses Google TEST ads (fine for closed testing, not for production)."
          else
            echo "Using real AdMob ids from secrets."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release bundle
        run: |
          ./gradlew bundleRelease \
            -PbuildNumber="$BUILD_NUMBER" \
            -PadmobAppId="$ADMOB_APP_ID" \
            -PadmobRewardedUnitId="$ADMOB_REWARDED_ID" \
            -PadmobTestDevices="$ADMOB_TEST_DEVICES" \
            --stacktrace

      - name: Verify signature and name the bundle
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB" | head -n 3
          VERSION_BASE=$(grep '^VERSION_BASE=' version.properties | cut -d= -f2 | tr -d '\r')
          VERSION="${VERSION_BASE}.${BUILD_NUMBER}"
          mkdir -p dist
          cp "$AAB" "dist/MochiPets-v${VERSION}.aab"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          {
            echo "### Mochi Pets release bundle"
            echo ""
            echo "- Version name: \`${VERSION}\`"
            echo "- Version code: \`${BUILD_NUMBER}\` (must be higher than any bundle already uploaded to Play)"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MochiPets-release-v${{ env.VERSION }}
          path: dist/*.aab
          retention-days: 30

      - name: Upload R8 mapping file (for crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-v${{ env.VERSION }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn
